name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'pentaCoxian/gglp'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate trusted release source and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 tool/release.py version --tag "$RELEASE_TAG"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.29.2'
          channel: stable
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ''platforms;android-36'' ''build-tools;36.0.0'' ''ndk;27.0.12077973'''
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s tool/tests -v
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/release.py signing
      - name: Build signed universal APK
        run: flutter build apk --release
      - name: Test Android update policy
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest
      - name: Verify APK and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 tool/release.py prepare
          --apk build/app/outputs/flutter-apk/app-release.apk
          --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          --tag "$RELEASE_TAG"
          --directory build/release
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/gglp-release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.repository == 'pentaCoxian/gglp'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-release
          path: build/release
      - name: Upload, verify, and publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 tool/release.py publish
          --tag "$RELEASE_TAG"
          --directory build/release
