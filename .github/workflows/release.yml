name: Android release
run-name: Release ${{ inputs.tag }} from main

# Run reviewed workflow code on main, never workflow code supplied by a tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag at the current main commit (CI must pass)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify-source:
    if: >-
      github.repository == 'pentaCoxian/gglp' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require trusted source, successful CI and protected environments
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release_guard.py source --tag "$RELEASE_TAG"
      - run: python3 tool/release.py version --tag "$RELEASE_TAG"

  build:
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      apk_sha256: ${{ steps.digest.outputs.sha256 }}
    # No signing environment, secrets, OIDC token or write permission here.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: false
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s tool/tests -v
      - name: Build unsigned universal release APK
        env:
          GGLP_UNSIGNED_RELEASE: 'true'
        run: flutter build apk --release
      - name: Test Android update policy
        working-directory: android
        env:
          GGLP_UNSIGNED_RELEASE: 'true'
        run: ./gradlew :app:testReleaseUnitTest
      - name: Validate unsigned APK
        run: >-
          python3 tool/release.py inspect
          --apk build/app/outputs/flutter-apk/app-release.apk
          --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          --tag "$RELEASE_TAG"
      - name: Record candidate digest
        id: digest
        run: |
          digest=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '### Release candidate'
            echo "Commit: $GITHUB_SHA"
            echo "Tag: $RELEASE_TAG"
            echo "Unsigned APK SHA-256: $digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: artifact
        with:
          name: unsigned-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  sign:
    needs: [verify-source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-signing
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    # Fresh runner: no Flutter, Gradle, app tests or dependency hooks execute.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          persist-credentials: false
      - name: Recheck source and release gates after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release_guard.py source --tag "$RELEASE_TAG"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: build/candidate
      - name: Verify exact candidate bytes
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: >-
          python3 tool/release_guard.py digest
          --file build/candidate/app-release.apk --sha256 "$EXPECTED_SHA256"
      - name: Revalidate unsigned candidate
        run: >-
          python3 tool/release.py inspect
          --apk build/candidate/app-release.apk
          --build-tools "$ANDROID_HOME/build-tools/36.0.0" --tag "$RELEASE_TAG"
      - name: Sign APK without executing application build code
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          python3 tool/release.py sign
          --apk build/candidate/app-release.apk
          --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          --output build/signed/app-release.apk
      - name: Verify known signer and prepare release assets
        run: >-
          python3 tool/release.py prepare
          --apk build/signed/app-release.apk
          --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          --tag "$RELEASE_TAG" --directory build/release
      - name: Attest APK and update manifest provenance
        id: attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            build/release/*.apk
            build/release/update.json
      - name: Include provenance in release checksums
        env:
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" build/release/provenance.json
          python3 tool/release.py seal --directory build/release --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: artifact
        with:
          name: signed-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [verify-source, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publishing
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          merge-multiple: true
          path: build/release
      # publish rechecks source/CI, certificate, metadata, alignment, run-bound
      # provenance and checksums before its first GitHub mutation.
      - name: Verify provenance and publish the complete draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tool/release.py publish
          --tag "$RELEASE_TAG" --directory build/release
          --build-tools "$ANDROID_HOME/build-tools/36.0.0"
